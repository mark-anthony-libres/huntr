  <!-- Landing loader: shown from the first paint until Flutter draws its
       first frame (no white page while the app downloads). -->
  <style>
    html, body { margin: 0; height: 100%; background: #0C0C0F; }
    #huntr-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 42%, #2A1508 0%, #0C0C0F 60%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 280ms ease-out;
    }
    #huntr-loading.done { opacity: 0; pointer-events: none; }
    /* The logo and "huntr" take turns in the same spot (one 5.2 s cycle):
       the logo builds itself (left leg drops in, right leg rises, the
       crossbar draws across, a light sweeps over the H) and comes apart;
       then "huntr" comes in as on the Me screen (letter by letter, each
       rising, fading in and growing with a little overshoot) and lifts
       away; and again. The logo pieces are slices of a transparent H. */
    #huntr-loading { --cycle: 5.2s; }
    #huntr-loading .stage { display: grid; place-items: center; }
    #huntr-loading .stage > * { grid-area: 1 / 1; }
    #huntr-loading .logo {
      position: relative; overflow: hidden; isolation: isolate;
      width: 160px; height: 160px;
    }
    #huntr-loading .logo img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      animation-duration: var(--cycle); animation-iteration-count: infinite;
    }
    #huntr-loading .logo .left { clip-path: inset(0 60.2% 0 0); animation-name: huntr-left; }
    #huntr-loading .logo .right { clip-path: inset(0 0 0 60.55%); animation-name: huntr-right; }
    #huntr-loading .logo .bar-h { clip-path: inset(0 39.4% 0 39.6%); animation-name: huntr-bar; }
    #huntr-loading .logo::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      /* the light, only where the H is */
      -webkit-mask: url(icons/huntr-mark.png) center / contain no-repeat;
      mask: url(icons/huntr-mark.png) center / contain no-repeat;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 236, 214, 0.75) 50%, transparent 65%)
        100% 0 / 300% 100% no-repeat;
      animation: huntr-shine var(--cycle) ease-in-out infinite;
    }
    #huntr-loading .name {
      display: flex; margin: 0; font-size: 64px; font-weight: 800; line-height: 1;
      animation: huntr-word var(--cycle) ease-in infinite;
    }
    /* each letter carries the gradient itself (a clipped gradient on the
       parent doesn't reach letters that move on their own) */
    #huntr-loading .name span {
      display: inline-block; padding-bottom: 0.08em;
      background: linear-gradient(135deg, #FF7A1A, #FF4F1A);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: huntr-letter var(--cycle) infinite;
    }
    #huntr-loading .name span:nth-child(2) { animation-delay: 120ms; }
    #huntr-loading .name span:nth-child(3) { animation-delay: 240ms; }
    #huntr-loading .name span:nth-child(4) { animation-delay: 360ms; }
    #huntr-loading .name span:nth-child(5) { animation-delay: 480ms; }
    .huntr-about { max-width: 560px; margin: 0 auto; padding: 32px 20px; color: #E6E6EA;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    .huntr-about h1 { color: #FF7A1A; }
    /* the logo: first half of the cycle */
    @keyframes huntr-left {
      0% { transform: translateY(-110%); animation-timing-function: cubic-bezier(.2, .9, .3, 1.15); }
      9%, 38% { transform: translateY(0); animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
      46%, 100% { transform: translateY(110%); }
    }
    @keyframes huntr-right {
      0%, 2% { transform: translateY(110%); animation-timing-function: cubic-bezier(.2, .9, .3, 1.15); }
      11%, 39% { transform: translateY(0); animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
      47%, 100% { transform: translateY(-110%); }
    }
    @keyframes huntr-bar {
      0%, 8% { clip-path: inset(0 60.4% 0 39.6%); animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
      15%, 34% { clip-path: inset(0 39.4% 0 39.6%); animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
      40%, 100% { clip-path: inset(0 39.4% 0 60.6%); }
    }
    @keyframes huntr-shine {
      0%, 17% { background-position: 100% 0; }
      30%, 100% { background-position: 0% 0; }
    }
    /* "huntr": second half */
    @keyframes huntr-letter {
      0%, 50% {
        opacity: 0; transform: translateY(24px) scale(.6);
        animation-timing-function: cubic-bezier(.34, 1.56, .64, 1);
      }
      58%, 100% { opacity: 1; transform: none; }
    }
    /* hidden until its letters start (the last ones are still finishing
       the cycle before), then up and away */
    @keyframes huntr-word {
      0%, 49.5% { opacity: 0; transform: none; }
      50%, 88% { opacity: 1; transform: none; }
      97%, 100% { opacity: 0; transform: translateY(-20px); }
    }
    @media (prefers-reduced-motion: reduce) {
      /* just the logo, still */
      #huntr-loading .logo, #huntr-loading .logo img { animation: none; }
      #huntr-loading .logo::after, #huntr-loading .name { display: none; }
    }

    /* Videos (stories, chat media) are controlled by the app, not the

       right-click "Save video as" or picture-in-picture on them. */
    video {
      pointer-events: none;

      <h1>HUNTR – the gay app to meet guys near you</h1>
      <p>HUNTR is a free gay app for gay, bi and queer men to meet guys right around them,
        for chats, friends, dates or more. It shows who's nearby and how far away they are,
        so meeting someone is a message away. Turn on JavaScript to use HUNTR in your browser.</p>
      <h2>Meet guys nearby</h2>
      <ul>
        <li><strong>Explore</strong>: browse guys near you, sorted by distance, and see who's online now.
          Filter by age, distance and what they're looking for: chat, friends, dates or a relationship.</li>
        <li><strong>Taps</strong>: let a guy know you're interested with a single tap, and see who tapped you.</li>
        <li><strong>Viewers</strong>: see who checked out your profile.</li>
      </ul>
      <h2>Chat your way</h2>
      <ul>
        <li><strong>Chat</strong>: message, send photos, videos and GIFs, and react to messages.</li>
        <li><strong>Private albums</strong>: keep photos off your profile and trade albums only with the guys you choose.
          Traded albums disappear a while after they're viewed.</li>
        <li><strong>Live location</strong>: share where you are, live, when you're about to meet.</li>
        <li><strong>Stories</strong>: post moments that disappear after a day.</li>
      </ul>
      <h2>Stay anonymous when you want</h2>
      <ul>
        <li><strong>Threads</strong>: post and chat anonymously with guys around you, under a random name.</li>
        <li><strong>Anonymous chats</strong>: start talking without showing your profile, and only reveal it when you both agree.</li>
      </ul>
      <h2>Safe by design</h2>
      <p>Block or report anyone, choose who sees your distance and online status, and unmatch any time.
        HUNTR is for adults only (18+).</p>
    </main>

  <script>
    // Flutter has drawn: fade the loader out, then remove it.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('huntr-loading');
      if (!loading) return;
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Installing HUNTR as an app (the browser's install offer). The browser
    // offers it before the app has loaded, so it's kept here until the
    // app's own "Get the HUNTR app" banner asks for it.
    window.huntrInstall = { prompt: null, installed: false };
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault(); // HUNTR shows its own banner instead
      window.huntrInstall.prompt = event;
      if (window.huntrInstallChanged) window.huntrInstallChanged();
    });
    window.addEventListener('appinstalled', function () {
      window.huntrInstall.prompt = null;
      window.huntrInstall.installed = true;
      if (window.huntrInstallChanged) window.huntrInstallChanged();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
